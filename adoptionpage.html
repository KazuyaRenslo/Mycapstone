<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adoptionpage</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>
    <form>
        <label for="First Name">First Name:</label>
        <input type="text" id="First Name" name="First Name" placeholder="First Name" required>
        <label for="Last Name">Last Name:</label>
        <input type="text" id="Last Name" name="Last Name" placeholder="Last Name" required>
        <br>
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" placeholder="name@email.com" required>
        <label for="Password">Password:</label>
        <input type="password" id="Password" name="Password"required>
        <p>Are you over the age of 18?</p>
        <label for="Yes">Yes:</label>
        <input type="radio" id="Yes" name="Age" value="Yes">
        <label for="No">No:</label>
        <input type="radio" id="No" name="Age" value="No">
        <p>Do you have a Credit Card or PayPal?</p>
        <select name="payment method" id="payment method">
            <option value="Credit Card" >Credit Card</option>
            <option value="PayPal" >PayPal</option>
        </select>
        <br>
        <br>
        <input type="submit" value="Submit Feedback">
    </form>

</body>
</html>
