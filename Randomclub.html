<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Request</title>
</head>
<body>
    <h2>Club request Form and questions</h2>
    <br>
    <form method="get" action="index3.html">
        <label for="Club Name">Club Name:</label>
        <input type="text" id="Club Name" name="Club Name">
        <br>
        <br>
        <label for="PresidentEmail">President Email:</label>
        <input type="text" id="PresidentEmail" name="PresidentEmail" placeholder="Jeremy.Will@ousd.org">
        <br>
        <br>
        <label for="MeetingDay">Preferred Meeting Day:</label>
        <select id="MeetingDay" name="MeetingDay">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
        </select>
        <br>
        <br>
        <label for="ClubDescription">Club Description:</label>
        <textarea id="ClubDescription" name="ClubDescription" placeholder="Describe your club here" cols="40" rows="4"></textarea>
        <br>
        <br>
        <label for="Club Password ">Club Password:</label>
        <input type="password" id="Club Password" name="Club Password">
        <br>
        <br>
        <input type = "submit" value="Submit">
    </form>
</body>
</html>
